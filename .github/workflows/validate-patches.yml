name: Patch validation

on:
  push:
    branches: [patchset]
  pull_request:
    branches: [patchset]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - name: Fetch upstream
        run: git clone --depth 1 https://github.com/CherryHQ/cherry-studio.git upstream
      - name: Configure patch commit identity
        run: |
          git config --global user.name "cherry-studio-patch automation"
          git config --global user.email "actions@users.noreply.github.com"
      - name: Apply patches
        run: scripts/apply-patches.sh upstream
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libevdev-dev libudev-dev libwayland-dev libx11-dev libxkbfile-dev libxtst-dev
      - name: Install dependencies
        run: pnpm --dir upstream install --frozen-lockfile
      - name: Verify chat attachment test
        run: pnpm --dir upstream exec vitest run src/renderer/components/composer/tools/components/__tests__/AttachmentButton.test.tsx --project renderer
      - name: Verify Clewdr compatibility tests
        run: >-
          pnpm --dir upstream exec vitest run
          packages/provider-registry/src
          src/main/ai/runtime/aiSdk/params/__tests__/nativeFileSupport.test.ts
          src/main/ai/messages/__tests__/attachmentRouting.test.ts
          src/main/ai/provider/custom/__tests__/boundary/clewdr.anthropicCompatibility.test.ts
          src/main/ai/provider/__tests__/endpoint.test.ts
      - name: Run upstream build checks
        run: pnpm --dir upstream build:check
